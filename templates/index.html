{% extends "base.html" %}

{% block title %}Users - My Movie App{% endblock %}

{% block content %}
    <h1>📋 Users</h1>

    <ul>
        {% for user in users %}
            <li>
                <a href="{{ url_for('list_favorite_movies_by_user', user_id=user.id) }}">
                    {{ user.name }}
                </a>
            </li>
        {% else %}
            <li>No users yet. Add one below!</li>
        {% endfor %}
    </ul>

    <h2>Add a New User</h2>
    <form action="{{ url_for('add_user') }}" method="post">
        <label for="name">User Name:</label>
        <input type="text" id="name" name="name" required>
        <button type="submit">Add User</button>
    </form>
{% endblock %}
